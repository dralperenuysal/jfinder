[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jfinder"
version = "0.1.0"
description = "Suggest target journals for a paper abstract, grounded in local OpenAlex data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "rank-bm25>=0.2.2",
    "openai>=1.30",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
docs = [
    "pypdf>=4.0",
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
jfinder = "jfinder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["jfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Legacy prototype scripts are not part of the jfinder package.
exclude = [
    "scripts/findFreeJournals.py",
    "scripts/findFreeJournalsOpenAlex.py",
    "scripts/functions.py",
]
